<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>大肥鱼 · 购物实验</title><style>
body{font:16px system-ui;background:#f4f5f8;color:#1f2937;margin:0}main{max-width:1040px;margin:36px auto;padding:24px}h1{font-size:28px}p{line-height:1.7}.grid{display:grid;grid-template-columns:1fr 330px;gap:24px}.card{background:white;padding:24px;border-radius:18px;box-shadow:0 4px 24px #17204a09}textarea,select,button{font:inherit;border:1px solid #ccd1dc;border-radius:10px;padding:12px}textarea{box-sizing:border-box;width:100%;height:140px;margin:16px 0}button{cursor:pointer;background:#eef2ff;margin:8px 6px 8px 0}button.primary{background:#4f46e5;color:white}#screen{width:100%;border-radius:12px}#state{font-weight:600}li{margin:10px 0;font-size:14px}.note{color:#64748b;font-size:14px}@media(max-width:720px){.grid{grid-template-columns:1fr}main{margin:0;padding:16px}}
</style><main><h1>大肥鱼 · 淘宝 / 美团实验</h1><p>在独立安卓虚拟手机中操作。到订单确认或付款入口停止，订单由你最终核对。</p><div class="grid"><section class="card"><select id="app"><option value="taobao">淘宝</option><option value="meituan">美团</option></select><textarea id="goal" maxlength="400" placeholder="例如：在淘宝搜索保温杯，比较两款的价格和容量。不要提交订单。"></textarea><div><button class="primary" id="start">开始 AI 任务</button><button id="open">打开 App / 刷新画面</button><button id="stop">停止</button></div><p id="state">正在连接…</p><p id="message"></p><ol id="steps"></ol><p class="note">首次请在虚拟手机窗口完成协议、登录及验证。模型只能输入搜索词；地址、密码、验证码和付款由你处理。截图和任务留在本机。登录/订单页面不会发送给模型。</p></section><aside class="card"><img id="screen" alt="虚拟手机当前画面"><p class="note">操作后更新画面；可在虚拟手机窗口接管。</p></aside></div></main><script>
let token=location.hash.slice(1);history.replaceState(null,'',location.pathname);let lastScreen=null;
async function request(path,data){let r=await fetch(path,{method:data?'POST':'GET',headers:{'X-FeiYu-Commerce':token,'Content-Type':'application/json'},body:data?JSON.stringify(data):undefined});if(!r.ok)throw Error('请求失败 '+r.status);return r}
async function refresh(){try{let s=await(await request('/api/status')).json();document.querySelector('#state').textContent=s.status;document.querySelector('#message').textContent=s.message;let list=document.querySelector('#steps');list.replaceChildren(...s.steps.map(x=>{let li=document.createElement('li');li.textContent=x.action+'：'+x.reason;return li}));let r=await request('/api/screen');let blob=await r.blob();if(lastScreen)URL.revokeObjectURL(lastScreen);lastScreen=URL.createObjectURL(blob);document.querySelector('#screen').src=lastScreen}catch(e){if(!token)document.querySelector('#state').textContent='请通过 Commerce.cmd 打开带本机凭证的地址'}}
async function start(explore){try{await request('/api/start',{app:document.querySelector('#app').value,goal:document.querySelector('#goal').value||'打开应用，检查当前页面',explore});await refresh()}catch(e){document.querySelector('#message').textContent=e.message}}
document.querySelector('#start').onclick=()=>start(false);document.querySelector('#open').onclick=()=>start(true);document.querySelector('#stop').onclick=()=>request('/api/stop',{});refresh();setInterval(refresh,3000);
</script></html>
